<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070E">
<title>DATASEEKER — все входы</title>
<style>
:root{
  --ink:#05070E;--panel:#0A0F1C;--panel-2:#0E1626;
  --line:rgba(125,169,245,.14);--line-strong:rgba(125,169,245,.28);
  --brand:#3B82F6;--brand-2:#7DA9F5;--amber:#F5B841;--live:#3DDC97;
  --text:#E8EEF9;--muted:#7E8DA8;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  min-height:100dvh;background:var(--ink);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  padding:32px 20px calc(32px + env(safe-area-inset-bottom));
  position:relative;overflow-x:hidden;
}
.glow,.grid{position:fixed;inset:0;pointer-events:none;z-index:0}
.glow{
  background:
    radial-gradient(900px 520px at 50% -12%, rgba(59,130,246,.20), transparent 62%),
    radial-gradient(700px 460px at 12% 112%, rgba(37,99,235,.14), transparent 60%),
    radial-gradient(600px 400px at 92% 78%, rgba(147,197,253,.07), transparent 60%);
  opacity:0;animation:glowIn 1.6s ease-out forwards;
}
.grid{
  background:
    linear-gradient(transparent calc(100% - 1px), rgba(125,169,245,.055) 0) 0 0/100% 30px,
    linear-gradient(90deg, transparent calc(100% - 1px), rgba(125,169,245,.055) 0) 0 0/30px 100%;
  -webkit-mask-image:radial-gradient(circle at 50% 42%, #000 26%, transparent 76%);
  mask-image:radial-gradient(circle at 50% 42%, #000 26%, transparent 76%);
}
@keyframes glowIn{to{opacity:1}}
.stage{position:relative;z-index:1;width:100%;max-width:520px}
.brand{text-align:center;margin-bottom:8px}
.eyebrow{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.3em;
  text-transform:uppercase;color:var(--muted);
  display:inline-flex;align-items:center;gap:10px;
}
.eyebrow::before,.eyebrow::after{content:'';width:22px;height:1px;background:var(--line-strong)}
.wordmark{
  margin-top:14px;font-size:clamp(2.6rem,11vw,3.6rem);font-weight:800;
  letter-spacing:-.035em;line-height:1;
  background:linear-gradient(180deg,#FFFFFF 0%,#A9C4F0 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.reveal{opacity:0;transform:translateY(14px);animation:reveal .7s cubic-bezier(.2,.7,.3,1) forwards}
.reveal.d1{animation-delay:.05s}
.reveal.d2{animation-delay:.18s}
.reveal.d3{animation-delay:.32s}
@keyframes reveal{to{opacity:1;transform:none}}
.route svg{display:block;width:100%;height:auto}
.arc-ghost{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 7;stroke-linecap:round}
.arc{
  fill:none;stroke:var(--brand);stroke-width:1.6;stroke-linecap:round;
  stroke-dasharray:520;stroke-dashoffset:520;
  animation:draw 2.6s cubic-bezier(.4,0,.2,1) forwards;
  filter:drop-shadow(0 0 6px rgba(59,130,246,.5));
}
@keyframes draw{to{stroke-dashoffset:0}}
.node{fill:var(--brand)}
.node-halo{fill:none;stroke:var(--brand);stroke-width:1;opacity:.5;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{r:6;opacity:.55}70%{r:20;opacity:0}100%{opacity:0}}
.plane{fill:var(--brand-2)}
.status{
  display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:22px;margin:2px 0 26px;
  font-family:var(--mono);font-size:.74rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--amber);
}
.status .box{width:7px;height:7px;background:var(--amber);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.status .flip{display:inline-block;animation:flip .35s ease-out}
@keyframes flip{from{transform:rotateX(-90deg);opacity:0}to{transform:none;opacity:1}}
.status.is-error{color:#F87171}
.status.is-error .box{background:#F87171;animation:none}
.status.is-live{color:var(--live)}
.status.is-live .box{background:var(--live)}
.gates[hidden]{display:none}
.prompt{font-size:1.05rem;font-weight:600;text-align:center;margin-bottom:4px}
.prompt-sub{text-align:center;color:var(--muted);font-size:.86rem;line-height:1.5;margin-bottom:18px}
.gate{
  display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:14px;
  width:100%;min-height:74px;padding:14px 16px;margin-bottom:10px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:14px;
  color:inherit;font:inherit;text-align:left;cursor:pointer;
  position:relative;overflow:hidden;
  transition:border-color .2s,transform .2s,box-shadow .3s;
}
.gate::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--brand);transform:scaleY(0);transition:transform .25s ease;
}
.gate:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:0 14px 34px -18px rgba(59,130,246,.75)}
.gate:hover::before{transform:scaleY(1)}
.gate:focus-visible{outline:2px solid var(--brand-2);outline-offset:3px}
.gate[hidden]{display:none}
.gate-icon{
  width:42px;height:42px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:11px;background:rgba(59,130,246,.08);
}
.gate-icon svg{width:20px;height:20px;stroke:var(--brand-2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gate-titlerow{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.gate-title{font-size:.98rem;font-weight:600}
.gate--live{
  border-color:rgba(61,220,151,.32);
  background:linear-gradient(180deg,rgba(61,220,151,.07),var(--panel));
}
.gate--live::before{background:var(--live)}
.gate--live:hover{border-color:rgba(61,220,151,.6);box-shadow:0 14px 34px -18px rgba(61,220,151,.7)}
.gate--live .gate-icon{border-color:rgba(61,220,151,.28);background:rgba(61,220,151,.08)}
.gate--live .gate-icon svg{stroke:var(--live)}
.live{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--live);
}
.live .pulse{
  width:6px;height:6px;border-radius:50%;background:var(--live);
  box-shadow:0 0 0 0 rgba(61,220,151,.55);animation:pulse 1.9s ease-out infinite;
}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.notice{
  border:1px solid var(--line);border-left:2px solid var(--amber);
  border-radius:12px;background:rgba(245,184,65,.05);
  padding:14px 16px;margin-bottom:14px;font-size:.86rem;line-height:1.55;color:#C7D3E6;
}
.notice[hidden]{display:none}
.notice b{
  display:block;font-weight:400;font-family:var(--mono);
  font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--amber);margin-bottom:6px;
}
.gate-sub{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:4px;word-break:break-all}
.gate-code{
  display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;color:var(--muted);
}
.gate-code svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s,stroke .2s}
.gate:hover .gate-code svg{transform:translateX(3px);stroke:var(--brand-2)}
.foot{text-align:center;margin-top:18px;font-size:.82rem;color:var(--muted);line-height:1.6}
.foot[hidden]{display:none}
.foot a{color:var(--brand-2);text-decoration:none;border-bottom:1px solid rgba(125,169,245,.35)}
.retry{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brand-2);background:none;border:1px solid var(--line-strong);
  border-radius:999px;padding:9px 18px;cursor:pointer;
}
.retry:hover{border-color:var(--brand);color:#fff}
@media (max-width:420px){
  .gate{grid-template-columns:38px 1fr auto;gap:12px;padding:12px 14px}
  .gate-icon{width:38px;height:38px}
  .gate-code span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .reveal{opacity:1;transform:none}
  .arc{stroke-dashoffset:0}
}
</style>
</head>
<body>

<!-- ⚙️ URL БОТА -->
<script>
  window.API_BASE = "https://qq-mrl3.onrender.com";
</script>

<div class="glow"></div>
<div class="grid"></div>

<main class="stage">
  <header class="brand">
    <p class="eyebrow reveal d1">Вечная ссылка</p>
    <h1 class="wordmark reveal d2">DATASEEKER</h1>
  </header>

  <div class="route reveal d3" aria-hidden="true">
    <svg viewBox="0 0 520 170" xmlns="http://www.w3.org/2000/svg">
      <path class="arc-ghost" d="M20,150 Q170,70 300,148"></path>
      <path class="arc-ghost" d="M220,152 Q380,40 505,120"></path>
      <path class="arc" id="arcPath" d="M60,132 Q260,18 460,132"></path>
      <circle class="node" cx="60" cy="132" r="4.5"></circle>
      <circle class="node node--to" cx="460" cy="132" r="4.5"></circle>
      <circle class="node-halo" cx="460" cy="132" r="6"></circle>
      <path class="plane" d="M13,0 L-5,6 L-1,0 L-5,-6 Z">
        <animateMotion id="planeMotion" dur="2.6s" repeatCount="indefinite" rotate="auto">
          <mpath href="#arcPath"></mpath>
        </animateMotion>
      </path>
    </svg>
  </div>

  <p class="status" id="status" role="status" aria-live="polite">
    <span class="box"></span><span id="statusText" class="flip">Проверяем зеркала</span>
  </p>

  <section class="gates" id="gates" hidden>
    <h2 class="prompt" id="prompt">Куда идём?</h2>
    <p class="prompt-sub" id="promptSub">Бот и его зеркала отвечают прямо сейчас — выбирайте, что удобнее.</p>

    <p class="notice" id="notice" hidden></p>

    <button class="gate gate--live" id="gateTg" type="button" hidden>
      <span class="gate-icon">
        <svg viewBox="0 0 24 24"><path d="M21 4 3 11l5 2 2 6 3-4 5 4z"></path><path d="M8 13l9-7"></path></svg>
      </span>
      <span>
        <span class="gate-titlerow">
          <span class="gate-title">Основной бот</span>
          <span class="live"><span class="pulse"></span>на связи</span>
        </span>
        <span class="gate-sub" id="tgSub">@—</span>
      </span>
      <span class="gate-code"><span>TG</span>
        <svg viewBox="0 0 24 24"><path d="M5 12h13"></path><path d="M13 6l6 6-6 6"></path></svg>
      </span>
    </button>

    <div id="mirrorGates"></div>
  </section>

  <p class="foot" id="foot" hidden></p>
</main>

<template id="gateTpl">
  <button class="gate gate--live" type="button">
    <span class="gate-icon">
      <svg viewBox="0 0 24 24"><path d="M21 4 3 11l5 2 2 6 3-4 5 4z"></path><path d="M8 13l9-7"></path></svg>
    </span>
    <span>
      <span class="gate-titlerow">
        <span class="gate-title">Зеркало</span>
        <span class="live"><span class="pulse"></span>на связи</span>
      </span>
      <span class="gate-sub">—</span>
    </span>
    <span class="gate-code"><span>TG</span>
      <svg viewBox="0 0 24 24"><path d="M5 12h13"></path><path d="M13 6l6 6-6 6"></path></svg>
    </span>
  </button>
</template>

<script>
(function () {
  'use strict';

  var API_BASE = (window.API_BASE || '').replace(/\/+$/, '');

  var els = {
    status: document.getElementById('status'),
    statusText: document.getElementById('statusText'),
    gates: document.getElementById('gates'),
    gateTg: document.getElementById('gateTg'),
    mirrorGates: document.getElementById('mirrorGates'),
    gateTpl: document.getElementById('gateTpl'),
    tgSub: document.getElementById('tgSub'),
    prompt: document.getElementById('prompt'),
    promptSub: document.getElementById('promptSub'),
    notice: document.getElementById('notice'),
    foot: document.getElementById('foot')
  };

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var ticker = null;
  function setStatus(text, tone) {
    els.statusText.textContent = text;
    els.statusText.className = 'flip';
    void els.statusText.offsetWidth;
    els.status.classList.toggle('is-error', tone === 'error');
    els.status.classList.toggle('is-live', tone === 'live');
  }
  function startTicker() {
    var steps = ['Проверяем зеркала', 'Сверяем маршрут', 'Выбираем точку входа'];
    var i = 0;
    ticker = setInterval(function () { setStatus(steps[++i % steps.length], ''); }, 1500);
  }
  function stopTicker() { clearInterval(ticker); ticker = null; }

  var leaving = false;
  function go(url, label) {
    if (!url || leaving) return;
    leaving = true;
    stopTicker();
    els.gates.hidden = true;
    setStatus('Открываем ' + label, 'live');
    setTimeout(function () { window.location.href = url; }, 500);
    setTimeout(function () {
      els.foot.innerHTML = 'Не открылось? <a href="' + esc(url) + '">Открыть вручную</a>';
      els.foot.hidden = false;
    }, 2200);
  }

  function addRetry(label) {
    var btn = document.createElement('button');
    btn.className = 'retry';
    btn.type = 'button';
    btn.textContent = label;
    btn.onclick = function () { window.location.reload(); };
    els.foot.innerHTML = '';
    els.foot.appendChild(btn);
    els.foot.hidden = false;
  }

  function getJson(url, ms) {
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { ctrl && ctrl.abort(); }, ms || 20000);
    return fetch(url, { signal: ctrl ? ctrl.signal : undefined, cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error(r.status)); })
      .finally(function () { clearTimeout(timer); });
  }

  function show(botUsername, mirrors) {
    stopTicker();

    var tgUrl = botUsername ? ('https://t.me/' + encodeURIComponent(botUsername)) : '';
    var hasBot = !!tgUrl;
    var hasMirrors = mirrors.length > 0;

    if (hasBot) {
      els.tgSub.textContent = '@' + botUsername;
      els.gateTg.hidden = false;
      els.gateTg.onclick = function () { go(tgUrl, 'Telegram'); };
    }

    els.mirrorGates.innerHTML = '';
    mirrors.forEach(function (m) {
      var node = els.gateTpl.content.firstElementChild.cloneNode(true);
      node.querySelector('.gate-sub').textContent = '@' + m.username;
      node.onclick = function () { go(m.url, m.username); };
      els.mirrorGates.appendChild(node);
    });

    if (hasBot && hasMirrors) {
      setStatus('Все входы на связи', 'live');
      els.prompt.textContent = 'Куда идём?';
      els.promptSub.textContent = 'Бот и его зеркала отвечают прямо сейчас — выбирайте, что удобнее.';
    } else if (hasBot) {
      setStatus('Бот на связи', 'live');
      els.prompt.textContent = 'Открыть бота';
      els.promptSub.textContent = 'Зеркала пока не созданы — работает основной бот.';
    } else if (hasMirrors) {
      setStatus('Зеркала на связи', 'live');
      els.prompt.textContent = 'Выберите зеркало';
      els.promptSub.textContent = 'Основной бот недоступен — работает зеркало.';
    } else {
      setStatus('Нет входов', 'error');
      els.prompt.textContent = 'Пусто';
      els.promptSub.textContent = 'Пока нет ни бота, ни зеркал.';
      addRetry('Повторить');
      els.gates.hidden = false;
      return;
    }

    els.gates.hidden = false;
  }

  function init() {
    startTicker();

    var botReq = getJson(API_BASE + '/api/v1/get_bot').catch(function () { return null; });
    var mirrorsReq = getJson(API_BASE + '/api/v1/get_mirrors').catch(function () { return null; });
    var minDelay = new Promise(function (res) { setTimeout(res, 1500); });

    Promise.all([botReq, mirrorsReq, minDelay]).then(function (r) {
      var botData = r[0] || {};
      var mirrorsData = r[1] || {};

      var botUsername = (botData.bot_link || '').replace(/^@/, '').trim();
      var mirrors = (mirrorsData.sites || [])
        .map(function (s) {
          var username = (s.host || '').replace(/^@/, '');
          if (!username) return null;
          return { username: username, url: s.url || ('https://t.me/' + username) };
        })
        .filter(Boolean);

      show(botUsername, mirrors);
    }).catch(function () {
      setStatus('Нет связи с сервером', 'error');
      els.notice.innerHTML = '<b>Сервер недоступен</b>Не удалось получить список ботов.';
      els.notice.hidden = false;
      addRetry('Повторить');
      els.gates.hidden = false;
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
                                                      </html>
